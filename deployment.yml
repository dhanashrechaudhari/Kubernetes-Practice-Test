apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-webapp
  template:
    metadata:
      labels:
        app: task-webapp
    spec:
      containers:
      - name: mycontainer
        image: nginx
        ports:
        - containerPort: 80